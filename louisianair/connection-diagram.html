<h2>How it all connects</h2>
<ol class="chain-steps"><li><strong>Battery pack</strong> powers everything through a USB cable.</li><li><strong>Pico W</strong> is the tiny computer that runs the show. It sits in the Maker Pi Pico base, which gives it easy plug-in ports.</li><li><strong>Grove cable</strong> is the single cable between the base and our sensor board (the ASB). It carries both power and data.</li><li><strong>Our sensor board (ASB)</strong> boosts the power and sends it down the flat ribbon cable to the Alphasense board (AFE).</li><li><strong>Gas sensor</strong> sits on the AFE. When hydrogen sulfide reaches it, it makes a tiny electrical signal, and the AFE turns that into a voltage.</li><li><strong>Back on the ASB,</strong> two converter chips turn that voltage into numbers. The Pico W reads those numbers over the Grove cable and can save them or send them over Wi-Fi.</li></ol>
<details class="chain-more"><summary>See more details</summary><div class="iso-legend"><span class="iso-keys"><span class="iso-key"><svg class="iso-swatch" data-mark="red" viewBox="0 0 16 10" aria-hidden="true"><path d="M1.5 5h13"/></svg>Power: USB into the Pico W, its 3.3 V out over Grove, stepped up on the ASB to 5 V for the ADCs and the AFE</span><span class="iso-key"><svg class="iso-swatch" data-mark="green" viewBox="0 0 16 10" aria-hidden="true"><path d="M1.5 5h13"/></svg>Analog signal: WE/AE voltages and PT1000 from the AFE</span><span class="iso-key"><svg class="iso-swatch" data-mark="blue" viewBox="0 0 16 10" aria-hidden="true"><path d="M1.5 5h13"/></svg>I²C: SDA/SCL between the ADS1115s and the Pico W</span><span class="iso-key"><svg class="iso-swatch" data-mark="lit" viewBox="0 0 16 10" aria-hidden="true"><path d="M2 4.5 8 1.5 14 4.5 14 6 8 9 2 6Z"/><path class="iso-swatch-crease" d="M2 4.5 8 7.5 14 4.5"/></svg>The part working at this stage</span></span><span class="iso-caption">Pico W in a Maker Pi Pico base; Grove 5 (GP8 SDA, GP9 SCL, 3.3 V) runs to J2 on the SmartCitizen 8-ch board, whose two ADS1115s answer at 0x48 and 0x49. A 2 mm 2×5 ribbon joins J5 to the Alphasense 2-way AFE, with the H₂S sensor in SN1. The AFE is built for 4-pin A4 sensors: use an H2S-A4, not the 3-pin H2S-A1, and seat it in the socket the AFE was configured for.</span></div></details>
</figcaption></figure></main><script type="module">const AZIMUTH = 45;
const ELEVATION = 30;
const SHADES = 4;
const RADIANS = Math.PI / 180;
const UNIT = Math.sqrt(1.6);
function cameraOf({ scale, azimuth = AZIMUTH, elevation = ELEVATION }) {
    const a = azimuth * RADIANS;
    const e = elevation * RADIANS;
    return { sinA: Math.sin(a), cosA: Math.cos(a), sinE: Math.sin(e), cosE: Math.cos(e), k: scale * UNIT };
}
function iso([x, y, z], projection) {
    const { origin } = projection;
    const { sinA, cosA, sinE, cosE, k } = cameraOf(projection);
    return [origin[0] + (x * sinA - y * cosA) * k, origin[1] + ((x * cosA + y * sinA) * sinE - z * cosE) * k];
}
function towardViewer(projection) {
    const { sinA, cosA } = cameraOf(projection);
    return [cosA, sinA];
}
function depthOf([x, y, z], projection) {
    const { sinA, cosA, sinE, cosE } = cameraOf(projection);
    return (x * cosA + y * sinA) * cosE + z * sinE;
}
const tenth = (value) => {
    const text = (Math.round(value * 10) / 10).toFixed(1).replace(/\.0$/, "");
    return text === "-0" ? "0" : text;
};
function pathOf(points, closed = false) {
    if (!points.length)

    return points.map(([x, y], at) => `${at ? "L" : "M"}${tenth(x)} ${tenth(y)}`).join("") + (closed ? "Z" : "");
}

function roundedPlan({ x, y, w, d, r }, steps = 8) {
    const radius = Math.max(0, Math.min(r, w / 2, d / 2));
    const corners = [
        [x + w - radius, y + radius, -90],
        [x + w - radius, y + d - radius, 0],
        [x + radius, y + d - radius, 90],
        [x + radius, y + radius, 180],
    ];
    const out = [];
    for (const [cx, cy, start] of corners) {

const STAGES = [{"name":"power","text":"power · USB 5 V → Pico 3V3 → U4 9 V → U5 5 V → AFE"},{"name":"sense","text":"sense · H₂S → working-electrode current"},{"name":"afe","text":"AFE · WE/AE currents → voltages on J5"},{"name":"adc","text":"ADS1115 ×2 · A0–A7 → 16-bit, 0x48 / 0x49"},{"name":"i2c","text":"I²C · BSS138 shifter → Grove 5 · GP8 / GP9"},{"name":"pico","text":"Pico W · polls 0x48, 0x49 → logs readings"}];
